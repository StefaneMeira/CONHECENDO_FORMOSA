<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dúvidas e sugestões</title>
    <link rel="stylesheet" href="duvidas.css">
</head>
<body>

    <header>
        <img src="assets/CONHECENDO FORMOSA.png" alt="Logo - Conhecendo Formosa">
    </header>
    <main>
    <h1>Em caso de dúvidas, preencha o formulário abaixo:</h1>
        <fieldset>
            <form action="" method="post">
                <label for="text">Seu nome</label>
                <input type="text" name="nome" id="nome"><br>
                <label for="text">Seu email</label>
                <input type="text" name="email" id="email"><br>
                <label for="text">WhatsApp</label>
                <input type="text" name="contato" id="contato"><br>

                <button>Enviar</button>
            </form>
        </fieldset>

        <h1>Para sugestões, preencha abaixo:</h1>
        <fieldset class="segundo">
            <form action="" method="post">
                <label for="text">Seu nome</label>
                <input type="text" name="nome" id="nome"><br>
                <label for="text">Deixe sua sugestão</label>
                <input type="text" name="sugestao" id="sugestao">
                <button >Enviar</button>
            </form>
        </fieldset>
    </main>

    <footer>
        <p>Feito por - Stéfane</p>
    </footer>
</body>
</html>
